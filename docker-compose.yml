services:
  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
  app1:
    image: nginx:alpine
    volumes:
      - ./html/app1:/usr/share/nginx/html:ro
    restart: unless-stopped
  app2:
    image: nginx:alpine
    volumes:
      - ./html/app2:/usr/share/nginx/html:ro
    restart: unless-stopped